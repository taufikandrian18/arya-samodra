name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache encoded images
        uses: actions/cache@v4
        with:
          path: public/media/img
          key: media-img-${{ hashFiles('assets-src/images/**', 'scripts/build-images.mjs') }}
          restore-keys: media-img-
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run budget
