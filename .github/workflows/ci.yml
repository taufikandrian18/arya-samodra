name: CI

# Checks every pull request (and pushes to feature branches). Deploys happen
# in deploy.yml once changes reach main.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache encoded images
        uses: actions/cache@v4
        with:
          path: public/media/img
          key: media-img-${{ hashFiles('assets-src/images/**', 'scripts/build-images.mjs') }}
          restore-keys: media-img-
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /arya-samodra/
      - run: npm run budget

  wordpress-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find cms/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Server scripts
        run: bash -n deploy/server/bootstrap.sh
